# NOTE: not actually loaded by the bot — main.py starts aria2c with CLI
# flags directly (_start_aria2()). Kept here in sync for reference/manual use.
enable-rpc=true
rpc-listen-port=6800
rpc-listen-all=true
daemon=false
log-level=warn
max-concurrent-downloads=10
split=16
max-connection-per-server=16
min-split-size=5M
allow-overwrite=true
auto-file-renaming=false

# Torrent/magnet peer discovery — without these, magnets rely entirely on
# the trackers in the link and hang at 0 peers if those are slow/down
enable-dht=true
dht-listen-port=6881-6999
bt-enable-lpd=true
enable-peer-exchange=true
bt-tracker-interval=60
bt-tracker-timeout=15
bt-tracker-connect-timeout=15
bt-request-peer-speed-limit=0
listen-port=6881-6999
bt-max-peers=100
seed-time=0
follow-torrent=mem
