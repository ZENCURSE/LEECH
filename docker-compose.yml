services:
  nxthub-bot:
    build: .
    container_name: nxthub-leech-bot
    restart: unless-stopped
    pull_policy: build
    network_mode: host          # uses VPS host network — fixes MongoDB timeout
    volumes:
      - ./downloads:/downloads
      - ./data:/app/data
      - ./config.py:/app/config.py   # live config — edit config.py, restart to apply
      - /JDownloader:/JDownloader    # JDownloader jar mounted from host
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
